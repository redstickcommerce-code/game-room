<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Room">
<meta name="theme-color" content="#1a0b3d">
<meta name="description" content="Classic games for phone and iPad: Checkers, Backgammon, Farkle, Mancala, Dots & Boxes.">
<title>Game Room</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one full-height column. Logo on top, a horizontal cover carousel in the middle
   (swipe, arrows or keys; the centred cover is the selection), then the selected game's title, blurb and Play button.
   A synthwave sun and moving grid floor sit behind everything and tint to the selected game's colour. */
:root{
  color-scheme:dark;
  --base:#1a0b3d;
  --theme:#5a20b0;        /* set per game by JS */
  --pop:#ffd23f;          /* set per game by JS */
  --ink:#ffffff; --muted:#d6c9ff;
  --f-display:"Bungee","Impact","Arial Black",sans-serif;
  --f-ui:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --card-w:clamp(120px, 54vw, 330px);   /* refined by JS to fit the stage height */
  --card-h:calc(var(--card-w) * 4 / 3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--base);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pop);outline-offset:3px}

/* ---- backdrop ---- */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(90% 60% at 50% 100%, color-mix(in srgb, var(--theme) 85%, transparent), transparent 70%),
    linear-gradient(180deg, #120630 0%, color-mix(in srgb, var(--theme) 45%, #120630) 62%, color-mix(in srgb, var(--theme) 70%, #000) 100%);
  transition:background 0s;
}
.tint{position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 35%, color-mix(in srgb, var(--theme) 55%, transparent), transparent 70%);transition:opacity .4s}
.stars{position:absolute;inset:0;background-image:
  radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
  radial-gradient(1px 1px at 28% 8%, #fff 50%, transparent 51%),
  radial-gradient(2px 2px at 44% 22%, #ffe9a8 50%, transparent 51%),
  radial-gradient(1px 1px at 63% 12%, #fff 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 78% 26%, #fff 50%, transparent 51%),
  radial-gradient(1px 1px at 90% 9%, #c9f 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 7% 40%, #9ff 50%, transparent 51%),
  radial-gradient(1px 1px at 95% 44%, #fff 50%, transparent 51%),
  radial-gradient(1px 1px at 35% 36%, #fff 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 56% 4%, #fff 50%, transparent 51%);
  animation:twinkle 4s ease-in-out infinite alternate;opacity:.9}
@keyframes twinkle{to{opacity:.45}}
.sun{position:absolute;left:50%;bottom:30vh;width:min(80vw,560px);aspect-ratio:1;translate:-50% 50%;border-radius:50%;
  background:linear-gradient(180deg, var(--pop) 0%, #ff4f8b 55%, #a020f0 100%);
  -webkit-mask:repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 20px) bottom/100% 45% no-repeat, linear-gradient(#000,#000) top/100% 56% no-repeat;
          mask:repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 20px) bottom/100% 45% no-repeat, linear-gradient(#000,#000) top/100% 56% no-repeat;
  opacity:.4;filter:blur(.3px);transition:background .5s}
.floor{position:absolute;left:-50%;right:-50%;bottom:0;height:32vh;perspective:300px;overflow:hidden}
.floor::before{content:"";position:absolute;inset:-100% 0 0 0;transform:rotateX(62deg);transform-origin:bottom;
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--pop) 70%, transparent) 2px, transparent 2px) 0 0/60px 60px,
    linear-gradient(0deg, color-mix(in srgb, var(--pop) 70%, transparent) 2px, transparent 2px) 0 0/60px 60px;
  animation:grid 1.6s linear infinite}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, color-mix(in srgb, var(--theme) 60%, #120630), transparent 60%)}
@keyframes grid{to{background-position:0 60px, 0 60px}}

/* ---- page ---- */
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding:max(14px, env(safe-area-inset-top,0px)) 0 max(14px, env(safe-area-inset-bottom,0px))}
header{text-align:center;padding:0 16px}
.logo{font-family:var(--f-display);font-size:clamp(34px, min(9vw, 8vh), 72px);line-height:1;margin:4px 0 0;letter-spacing:.02em;
  text-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 30px rgba(255,79,139,.45)}
.logo span{display:inline-block;animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i) * 90ms)}
@keyframes bob{50%{transform:translateY(-4px)}}
.tag{font-family:var(--f-ui);font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-size:clamp(12px,1.8vh,16px);margin-top:6px}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;position:relative}
.rail{
  display:flex;align-items:center;gap:calc(var(--card-w) * -0.08);
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:calc(var(--card-h) * .08) calc(50% - var(--card-w) / 2);
  perspective:1100px;
}
.rail::-webkit-scrollbar{display:none}
.card{
  flex:none;width:var(--card-w);height:var(--card-h);scroll-snap-align:center;position:relative;
  border:none;padding:0;background:none;border-radius:20px;
  transform-style:preserve-3d;will-change:transform;
}
.card .art{position:absolute;inset:0;border-radius:20px;overflow:hidden;
  box-shadow:0 22px 40px rgba(0,0,0,.5), 0 0 0 3px rgba(255,255,255,.14);
  transition:box-shadow .3s}
.card img{width:100%;height:100%;display:block;object-fit:cover;-webkit-user-drag:none;pointer-events:none}
.card .label{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 12px;text-align:center;
  font-family:var(--f-display);font-size:calc(var(--card-w) * .095);line-height:1.05;letter-spacing:.02em;
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.88) 45%);text-shadow:0 3px 0 rgba(0,0,0,.45)}
.card .shine{position:absolute;inset:0;border-radius:20px;pointer-events:none;
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 45%, transparent 60%);background-size:250% 100%;background-position:100% 0;opacity:0}
.card.on .art{box-shadow:0 26px 50px rgba(0,0,0,.55), 0 0 0 4px var(--pop), 0 0 40px color-mix(in srgb, var(--pop) 60%, transparent)}
.card .label{transition:opacity .25s}
.card.on .label{opacity:0}
.card.on .shine{opacity:1;animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,40%{background-position:100% 0}80%,100%{background-position:-50% 0}}
.card.soon .art{background:repeating-linear-gradient(45deg, #2b1563 0 18px, #23104f 18px 36px);display:grid;place-items:center}
.card.soon .q{font-family:var(--f-display);font-size:calc(var(--card-w) * .5);color:rgba(255,255,255,.7)}

.arrow{position:absolute;top:50%;translate:0 -50%;z-index:3;width:52px;height:52px;border-radius:50%;border:none;
  background:rgba(0,0,0,.35);color:#fff;font-size:22px;display:grid;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.arrow:active{scale:.92}
.arrow.l{left:max(10px, env(safe-area-inset-left,0px))} .arrow.r{right:max(10px, env(safe-area-inset-right,0px))}
@media (hover:none) and (max-width:600px){ .arrow{display:none} }

.info{text-align:center;margin:0 12px;padding:clamp(8px,1.4vh,14px) 14px;border-radius:18px;background:rgba(14,6,38,.82);display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2vh,12px)}
.title{font-family:var(--f-display);font-size:clamp(30px, min(8vw, 6.5vh), 60px);line-height:1;color:var(--pop);
  text-shadow:0 4px 0 rgba(0,0,0,.4);min-height:1em}
.title.swap{animation:swap .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes swap{from{transform:translateY(12px) scale(.9);opacity:0}}
.blurb{max-width:46ch;color:var(--muted);font-size:clamp(15px,2vh,18px);line-height:1.35;min-height:2.7em}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font-family:var(--f-ui);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.play{margin-top:4px;min-width:min(320px, 80vw);min-height:clamp(56px,8vh,70px);border-radius:18px;border:none;
  font-family:var(--f-display);font-size:clamp(22px,3.4vh,30px);letter-spacing:.04em;color:#26103f;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--pop) 70%, #fff), var(--pop) 60%, color-mix(in srgb, var(--pop) 75%, #000));
  box-shadow:0 6px 0 color-mix(in srgb, var(--pop) 50%, #000), 0 14px 30px rgba(0,0,0,.4);
  transition:transform .08s ease}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb, var(--pop) 50%, #000)}
.play[aria-disabled="true"]{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);pointer-events:none}
.play .tri{width:0;height:0;border-left:16px solid currentColor;border-top:10px solid transparent;border-bottom:10px solid transparent}
.dots{display:flex;gap:8px;justify-content:center;margin-top:2px}
.dots button{width:10px;height:10px;border-radius:50%;border:none;padding:0;background:rgba(255,255,255,.55);transition:width .25s, background .25s}
.dots button[aria-current="true"]{width:28px;border-radius:5px;background:var(--pop)}
.foot{display:flex;justify-content:center;margin-top:8px}
.sound{background:rgba(14,6,38,.82);border:1px solid rgba(255,255,255,.5);border-radius:999px;color:var(--muted);font-family:var(--f-ui);font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;min-height:36px}

/* launch transition */
.launch{position:fixed;inset:0;z-index:50;pointer-events:none;background:var(--pop);clip-path:circle(0 at 50% 50%);transition:clip-path .45s cubic-bezier(.6,0,.3,1)}
.launch.go{clip-path:circle(150% at 50% 50%)}

/* short landscape phones: tighten everything */
@media (max-height:500px){
  .tag,.dots,.foot{display:none}
  .blurb{min-height:0;font-size:14px}
  .info{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:6px 16px}
  .blurb{flex-basis:100%;order:3}
}
@media (prefers-reduced-motion: reduce){
  .stars,.floor::before,.logo span,.card.on .shine,.title.swap{animation:none}
  .launch{transition:none}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="tint"></div><div class="stars"></div><div class="sun"></div><div class="floor"></div></div>

<div class="app">
  <header>
    <h1 class="logo" id="logo" aria-label="Game Room">GAME ROOM</h1>
    <div class="tag">Pick a game · Swipe to browse</div>
  </header>

  <main class="stage">
    <button class="arrow l" id="prev" type="button" aria-label="Previous game">&#9664;</button>
    <div class="rail" id="rail" role="listbox" aria-label="Games" tabindex="0"></div>
    <button class="arrow r" id="next" type="button" aria-label="Next game">&#9654;</button>
  </main>

  <section class="info" aria-live="polite">
    <div class="title" id="title"></div>
    <div class="chips" id="chips"></div>
    <div class="blurb" id="blurb"></div>
    <a class="play" id="play" href="#"><span class="tri" aria-hidden="true"></span><span id="playText">PLAY</span></a>
    <div class="dots" id="dots" role="tablist" aria-label="Choose game"></div>
    <div class="foot"><button class="sound" id="btnSound" type="button">♪</button></div>
  </section>
</div>
<div class="launch" id="launch" aria-hidden="true"></div>

<script src="assets/kit.js"></script>
<script>
(function(){
'use strict';
/* The game library. To add a game: drop it in games/<id>/index.html, add a 300×400 cover in assets/covers/, and list it here. */
const GAMES = [
  {id: 'checkers',   title: 'Checkers',      theme: '#0f7d7a', pop: '#ff5a64', chips: ['2 players', 'vs Computer'],
   blurb: 'Jump, capture, and race for the back row to get crowned. Multi-jumps and kings included.'},
  {id: 'backgammon', title: 'Backgammon',    theme: '#6a24c9', pop: '#c6f432', chips: ['2 players', 'vs Computer', 'Dice'],
   blurb: 'Roll, run and hit. Bring all fifteen checkers home and bear them off before your opponent does.'},
  {id: 'farkle',     title: 'Farkle',        theme: '#2b46c0', pop: '#f5a21d', chips: ['1–6 players', 'vs Computer', 'Dice'],
   blurb: 'Push-your-luck dice. Keep the scorers and roll again, or bank your points before you Farkle.'},
  {id: 'mancala',    title: 'Mancala',       theme: '#1f6b52', pop: '#e0b45a', chips: ['2 players', 'vs Computer'],
   blurb: 'Sow stones around the board, land in your store for a free turn, and capture across the row.'},
  {id: 'dots',       title: 'Dots & Boxes',  theme: '#e0541d', pop: '#ffe14d', chips: ['2 players', 'vs Computer'],
   blurb: 'Take turns drawing lines. Close a box to claim it and go again. Don’t hand over the chains!'},
  {id: 'soon',       title: 'More Soon',     theme: '#3b1d80', pop: '#ff4f8b', chips: ['Coming soon'], soon: true,
   blurb: 'Chess, dominoes, cribbage… the game room is just getting started.'}
];

const $ = id => document.getElementById(id);
const store = Kit.store('gameroom');
const rail = $('rail'), root = document.documentElement;
const RM = Kit.RM;

// rainbow logo
const LOGO_COLS = ['#ff4f8b', '#ffd23f', '#c6f432', '#22c3c3', '#7b96ee', '#c78be6', '#ff8a3d', '#ff4f8b', '#ffd23f'];
$('logo').innerHTML = [...'GAME ROOM'].map((ch, i) => ch === ' ' ? ' ' : `<span style="--i:${i};color:${LOGO_COLS[i]}" aria-hidden="true">${ch}</span>`).join('');

// cards + dots
const cards = GAMES.map((g, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'card' + (g.soon ? ' soon' : '');
  b.setAttribute('role', 'option'); b.setAttribute('aria-label', g.title); b.dataset.i = i;
  b.innerHTML = g.soon
    ? `<div class="art"><span class="q">?</span></div><div class="label">${g.title}</div><div class="shine"></div>`
    : `<div class="art"><img src="assets/covers/${g.id}.svg" alt="" draggable="false"></div><div class="label">${g.title}</div><div class="shine"></div>`;
  rail.appendChild(b);
  return b;
});
const dotBtns = GAMES.map((g, i) => {
  const d = document.createElement('button');
  d.type = 'button'; d.setAttribute('aria-label', g.title); d.addEventListener('click', () => go(i));
  $('dots').appendChild(d);
  return d;
});

let cur = -1;
const href = g => g.soon ? '#' : `games/${g.id}/index.html`;
function select(i){
  if (i === cur) return;
  cur = i;
  const g = GAMES[i];
  root.style.setProperty('--theme', g.theme);
  root.style.setProperty('--pop', g.pop);
  document.querySelector('meta[name=theme-color]').setAttribute('content', g.theme);
  const t = $('title'); t.textContent = g.title; t.classList.remove('swap'); void t.offsetWidth; t.classList.add('swap');
  $('blurb').textContent = g.blurb;
  $('chips').innerHTML = ''; g.chips.forEach(c => { const s = document.createElement('span'); s.className = 'chip'; s.textContent = c; $('chips').appendChild(s); });
  const play = $('play');
  play.href = href(g);
  play.setAttribute('aria-disabled', String(!!g.soon));
  $('playText').textContent = g.soon ? 'SOON' : 'PLAY';
  cards.forEach((c, k) => { c.classList.toggle('on', k === i); c.setAttribute('aria-selected', String(k === i)); });
  dotBtns.forEach((d, k) => d.setAttribute('aria-current', String(k === i)));
  store.set('last', g.id);
  Kit.sound.tone(520 + i * 60, 0.07, 'triangle', 0.05);
}

/* Coverflow: scale, tilt and fade each card by its distance from the centre. */
function layout(){
  const mid = rail.scrollLeft + rail.clientWidth / 2;
  let best = 0, bestD = Infinity;
  cards.forEach((c, i) => {
    const center = c.offsetLeft + c.offsetWidth / 2;
    const off = (center - mid) / c.offsetWidth;
    const a = Math.min(Math.abs(off), 2.5);
    const s = 1 - Math.min(a, 1.5) * 0.2;
    const ry = Math.max(-45, Math.min(45, -off * 32));
    c.style.transform = `translateZ(${-a * 60}px) rotateY(${ry}deg) scale(${s})`;
    c.style.opacity = String(Math.max(0.25, 1 - a * 0.3));
    c.style.zIndex = String(100 - Math.round(a * 10));
    if (Math.abs(off) < bestD){ bestD = Math.abs(off); best = i; }
  });
  select(best);
}
let ticking = false;
rail.addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(() => { ticking = false; layout(); }); } }, {passive: true});
/* Size covers to the space between the logo and the info panel. */
function fit(){
  const stage = document.querySelector('.stage');
  const h = stage.clientHeight / 1.16;
  const w = Math.max(110, Math.min(h * 0.75, innerWidth * 0.54, 330));
  root.style.setProperty('--card-w', w + 'px');
}
window.addEventListener('resize', () => { fit(); go(cur, true); });
fit();

function go(i, instant){
  i = Math.max(0, Math.min(GAMES.length - 1, i));
  const c = cards[i];
  rail.scrollTo({left: c.offsetLeft + c.offsetWidth / 2 - rail.clientWidth / 2, behavior: instant || RM ? 'auto' : 'smooth'});
  if (instant) layout();
}

function launch(i){
  const g = GAMES[i];
  if (g.soon){
    Kit.sound.bad();
    if (cards[i].animate) cards[i].animate([{translate: '0 0'}, {translate: '-10px 0'}, {translate: '10px 0'}, {translate: '0 0'}], {duration: 300});
    return;
  }
  Kit.sound.good();
  const l = $('launch');
  l.classList.add('go');
  setTimeout(() => { location.href = href(g); }, RM ? 0 : 420);
}

rail.addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  const i = +c.dataset.i;
  if (i === cur) launch(i); else go(i);
});
$('play').addEventListener('click', e => { e.preventDefault(); launch(cur); });
$('prev').addEventListener('click', () => go(cur - 1));
$('next').addEventListener('click', () => go(cur + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'){ e.preventDefault(); go(cur - 1); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); go(cur + 1); }
  else if ((e.key === 'Enter' || e.key === ' ') && (document.activeElement === document.body || document.activeElement === rail)){ e.preventDefault(); launch(cur); }
});
// mouse wheel: vertical wheel moves sideways
rail.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){ e.preventDefault(); rail.scrollBy({left: e.deltaY}); } }, {passive: false});

const sb = $('btnSound');
const syncSound = () => { sb.textContent = Kit.sound.on ? '♪ Sound on' : '♪ Sound off'; };
sb.addEventListener('click', () => { Kit.sound.toggle(); syncSound(); });
syncSound();

// returning from a game via Back restores the page from cache: clear the launch wipe
window.addEventListener('pageshow', () => $('launch').classList.remove('go'));

// start on the last game played
const lastId = store.get('last', GAMES[0].id);
const start = Math.max(0, GAMES.findIndex(g => g.id === lastId));
requestAnimationFrame(() => { go(start, true); });
})();
</script>
</body>
</html>
